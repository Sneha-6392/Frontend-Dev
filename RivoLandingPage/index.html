<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rivo landing page</title>
</head>
<body>
    <div id="hero-page"></div>
    <script>
        fetch('/Frontend-Dev/RivoLandingPage/components/heroPage.html')
      .then(res => res.text())
      .then(data => document.getElementById('hero-page').innerHTML = data);
    </script>
    
    <div id="best-selling"></div>
    <script>
      fetch('/Frontend-Dev/RivoLandingPage/components/bestSelling.html')
      .then(res => res.text())
      .then(data => document.getElementById('best-selling').innerHTML = data);
    </script>

    <div id="product-page"></div>
    <script>
        fetch('/Frontend-Dev/RivoLandingPage/components/productPage.html')
        .then(res => res.text())
        .then(data => document.getElementById('product-page').innerHTML = data);
    </script>

    <div id="catalog"></div>
    <script>
        fetch('/Frontend-Dev/RivoLandingPage/components/catalog.html')
        .then(res => res.text())
        .then(data => document.getElementById('catalog').innerHTML = data);
    </script>

    <div id="feedback"></div>
    <script>
        fetch('/Frontend-Dev/RivoLandingPage/components/feedback.html')
        .then(res => res.text())
        .then(data => document.getElementById('feedback').innerHTML = data);
    </script>

    <div id="footer"></div>
    <script>
        fetch('/Frontend-Dev/RivoLandingPage/components/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer').innerHTML = data);
    </script>
</body>
</html>
