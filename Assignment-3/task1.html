<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded YouTube Video</title>
</head>
<body>
    <h1 align="center">My Favorite YouTube Video</h1>
    <div align="center">
        <iframe 
            width="100%" 
            height="100%" 
            src="vdo.mp4" 
            title="YouTube video player" 
            frameborder="0" 
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
