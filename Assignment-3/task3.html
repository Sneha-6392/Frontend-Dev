<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>
<body>
    <h1 align="center">Course Registration Form</h1>

    <form method="post" action="#">
        <fieldset>
            <legend><b>Student Information</b></legend>

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Course Selection</b></legend>

            <label for="course">Select Course:</label><br>
            <select id="course" name="course">
                <option value="">-- Choose a Course --</option>
                <option value="webdev">Web Development</option>
                <option value="datasci">Data Science</option>
                <option value="ai">Artificial Intelligence</option>
                <option value="design">UI/UX Design</option>
            </select><br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </fieldset>
    </form>

    <br><br>

    <h2 align="center">Available Course Schedules</h2>

    <table border="1" cellpadding="10" cellspacing="0" align="center" width="70%">
        <tr bgcolor="#f2f2f2">
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM - 12:00 PM</td>
            <td>Mr. Rajesh Kumar</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>2:00 PM - 4:00 PM</td>
            <td>Ms. Neha Singh</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>11:00 AM - 1:00 PM</td>
            <td>Dr. Ankit Mehra</td>
        </tr>
    </table>

    <br>
    <footer align="center">
        <p>© 2025 PW Academy. All rights reserved.</p>
    </footer>
</body>
</html>
