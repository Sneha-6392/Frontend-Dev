<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML practice</title>
</head>
<body>
    <h1>HEADER</h1>
    <h3>Add Node</h3>
    <h4>Select Chain</h4>
    <img src="https://img.freepik.com/free-vector/cryptocurrency-bitcoin-golden-coin-background_1017-31505.jpg?semt=ais_hybrid&w=740&q=80" alt="img1" width="300" height="150">
    <img src="https://img.freepik.com/free-vector/cryptocurrency-bitcoin-golden-coin-background_1017-31505.jpg?semt=ais_hybrid&w=740&q=80" alt="img2" width="300" height="150">
    <img src="https://img.freepik.com/free-vector/cryptocurrency-bitcoin-golden-coin-background_1017-31505.jpg?semt=ais_hybrid&w=740&q=80" alt="img3" width="300" height="150">
    <img src="https://img.freepik.com/free-vector/cryptocurrency-bitcoin-golden-coin-background_1017-31505.jpg?semt=ais_hybrid&w=740&q=80" alt="img4" width="300" height="150">
    <h4>Select Environment</h4>
    <form>
        <label>
            <input type="radio">
            Dev Net
        </label>
        <label>
            <input type="radio">
            Test Net
        </label>
        <label>
            <input type="radio">
            Main Net
        </label>
    <h4>Select Server Type</h4>
        <label>
            <input type="radio">
            Small
        </label>
        <label>
            <input type="radio">
            Medium
        </label>
        <label>
            <input type="radio">
            Large
        </label>
    <h4>Select Number of Months</h4>
        <label>
            <input type="radio">
            1 Month
        </label>
        <label>
            <input type="radio">
            3 Months
        </label>
        <label>
            <input type="radio">
            6 Months
        </label>
        <label>
            <input type="radio">
            12 Months
        </label>
    </form>
    <h4>Blockpi Api</h4>
    <input type="text" placeholder="Enter blockpi api">
    <h3>Price: 5,999</h3>
    <button>Cancel</button>
    <button>Add Node</button>
    <h1>FOOTER</h1>
</body>
</html>
