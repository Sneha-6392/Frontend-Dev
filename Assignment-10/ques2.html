<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Portfolio — Bootstrap Basics</title>

    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light text-dark">

    <!-- Header Section -->
    <header class="container text-center mt-4 mb-3">
      <h1 class="fw-bold">Vanshika Parashar</h1>
      <p class="lead text-muted">Aspiring Frontend Developer | Passionate about Clean UI & Modern Design</p>
    </header>

    <!-- Contact Form Section -->
    <section class="container p-5 bg-white rounded shadow-sm mb-5">
      <h2 class="text-center mb-4 fw-bold">Contact Me</h2>
      <form class="text-center mx-auto" style="max-width: 400px;">
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Your Name" required>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Your Email" required>
        </div>
        <div class="mb-3">
          <textarea class="form-control" rows="4" placeholder="Your Message" required></textarea>
        </div>
        <button type="submit" class="btn btn-success w-100">Send Message</button>
      </form>
    </section>

    <!-- Buttons Section (moved to last) -->
    <section class="container text-center mb-5">
      <button class="btn btn-primary me-2">Hire Me</button>
      <button class="btn btn-outline-dark">Download CV</button>
    </section>

    <!-- Footer -->
    <footer class="text-center py-3 text-muted small">
      © 2025 Vanshika Parashar | Built with Bootstrap Utilities
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
