<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Search - Products</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        .product {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        #loading {
            display: none;
            font-style: italic;
            color: blue;
        }

        #search {
            width: 100%;
            padding: 10px;
            font-size: 17px;
        }
    </style>
</head>
<body>

<div style="width: 400px; margin: 30px auto;">
    <h2>Live Product Search</h2>
    <input type="text" id="search" placeholder="Search products...">

    <p id="loading">Loading...</p>

    <div id="results"></div>
</div>


<script>
$(document).ready(function () {

    $("#search").on("input", function () {
        const query = $(this).val().trim();

        $("#loading").show(); 

        $.ajax({
            url: `http://localhost:3000/products?q=${query}`,
            method: "GET",
            success: function (data) {
                $("#loading").hide(); 
                $("#results").empty();

                if (data.length === 0) {
                    $("#results").html("<p> No products found</p>");
                    return;
                }

                data.forEach(product => {
                    $("#results").append(`
                        <div class="product">
                            <img src="${product.image}" width="50">
                            <div>
                                <h4>${product.name}</h4>
                                <p>Price: ₹${product.price}</p>
                            </div>
                        </div>
                    `);
                });
            }
        });
    });

});
</script>

</body>
</html>
