<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="first.css" />
</head>
<body>
  <h1>Responsive CSS Grid Image Gallery</h1>

  <div class="gallery">
    <div class="item blur">
      <img src="https://picsum.photos/300/200?1" alt="Blur Image" />
      <p>Blur Filter</p>
    </div>

    <div class="item grayscale">
      <img src="https://picsum.photos/300/200?2" alt="Grayscale Image" />
      <p>Grayscale Filter</p>
    </div>

    <div class="item sepia">
      <img src="https://picsum.photos/300/200?3" alt="Sepia Image" />
      <p>Sepia Filter</p>
    </div>

    <div class="item bright">
      <img src="https://picsum.photos/300/200?4" alt="Brightness Image" />
      <p>Brightness Filter</p>
    </div>

    <div class="item contrast">
      <img src="https://picsum.photos/300/200?5" alt="Contrast Image" />
      <p>Contrast Filter</p>
    </div>

    <div class="item hue">
      <img src="https://picsum.photos/300/200?6" alt="Hue Rotate Image" />
      <p>Hue-Rotate Filter</p>
    </div>
  </div>
</body>
</html>
