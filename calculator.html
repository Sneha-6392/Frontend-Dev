<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculator.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <div class="input">0</div>
        <div class="button">
            <div class="light-blue">AC</div>
            <div class="light-blue">±</div>
            <div class="light-blue">%</div>
            <div>÷</div>
            <div class="transparent">7</div>
            <div class="transparent">8</div>
            <div class="transparent">9</div>
            <div>*</div>
            <div class="transparent">4</div>
            <div class="transparent">5</div>
            <div class="transparent">6</div>
            <div>-</div>
            <div class="transparent">1</div>
            <div class="transparent">2</div>
            <div class="transparent">3</div>
            <div>+</div>
            <div class="zero">0</div>
            <div class="transparent">.</div>
            <div>=</div>
        </div>
    </div>
</body>
</html>
