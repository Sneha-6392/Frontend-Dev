<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Character Counter</title>

    <style>
        .container {
            width: 380px;          
            margin: 60px auto;
            padding: 25px 28px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            border: 1px solid #e3e9f2;
        }

        h2 {
            color: #0b3c74;
            font-size: 24px;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 600;
        }

        body {
            background: #f2f7ff;
            font-family: "Poppins", sans-serif;
        }

        textarea {
            width: 100%;
            height: 120px;
            font-size: 15px;
            padding: 12px;
            border-radius: 10px;
            border: 1.8px solid #b9c9e3;
            outline: none;
            background: #fbfdff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            transition: 0.2s;
            resize: none;
        }

        textarea:focus {
            border-color: #2f6fd3;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.10);
        }

        #counter {
            font-size: 18px;
            font-weight: 600;
            color: #2f6fd3;
            margin-top: 12px;
            display: inline-block;
            padding: 6px 12px;
            background: #e9f1ff;
            border-radius: 6px;
        }

        #resetBtn {
            margin-top: 18px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #2f6fd3;
            color: white;
            border: none;
            border-radius: 8px;
            transition: 0.2s;
            width: 100%;
        }

        #resetBtn:hover {
            background: #1f54aa;
            box-shadow: 0 4px 10px rgba(0,0,0,0.18);
        }

        #resetBtn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <h2>Live Character Counter (Max 100)</h2>
    <textarea id="textBox" placeholder="Start typing..."></textarea>
    <br><br>
    <span id="counter">100 characters left</span>
    <br><br>
    <button id="resetBtn">Reset</button>
    <script>
        const textBox = document.getElementById("textBox");
        const counter = document.getElementById("counter");
        const resetBtn = document.getElementById("resetBtn");
        const max = 100;
        textBox.addEventListener("keydown", function(e) {
            const remaining = max - textBox.value.length;
            if (remaining <= 0 && e.key.length === 1) {
                e.preventDefault(); 
            }
        });
        textBox.addEventListener("input", function() {
            let remaining = max - textBox.value.length;
            if (remaining < 0) remaining = 0;
            counter.textContent = remaining + " characters left";
            if (remaining === 0) {
                counter.style.color = "red";
            } else if (remaining <= 20) {
                counter.style.color = "orange";
            } else {
                counter.style.color = "green";
            }
        });
        resetBtn.addEventListener("click", function() {
            textBox.value = "";
            counter.textContent = max + " characters left";
            counter.style.color = "green";
        });
    </script>
</body>
</html>
